name: Deploy wallet signer to VPS

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  SIGNER_IMAGE_NAME: ${{ github.repository_owner }}/financemanager-wallet-signer

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production-signer
    steps:
      - name: Deploy locked signer
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /var/www/cashpilot.mohiebi.com
            docker pull ghcr.io/${{ env.SIGNER_IMAGE_NAME }}:latest
            docker compose -f compose.prod.yaml up -d --no-deps --force-recreate wallet-signer
            echo "Signer deployed in locked state. Unlock it interactively with: docker exec -i cashpilot-wallet-signer node dist/cli.js unlock"
