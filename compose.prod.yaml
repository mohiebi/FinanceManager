services:
  app:
    image: ghcr.io/mohiebi/financemanager:latest
    container_name: cashpilot-app
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: portfolio-mariadb
      DB_PORT: 3306
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - storage-data:/var/www/html/storage/app
      - storage-logs:/var/www/html/storage/logs
      - passport-keys:/var/www/html/storage/passport
    networks:
      - portfolio-net

volumes:
  storage-data:
  storage-logs:
  passport-keys:

networks:
  portfolio-net:
    external: true
