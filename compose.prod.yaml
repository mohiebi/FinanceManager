services:
  app:
    image: ghcr.io/mohiebi/financemanager:latest
    container_name: cashpilot-app
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: portfolio-mariadb
      DB_PORT: 3306
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - storage-data:/var/www/html/storage/app
      - storage-logs:/var/www/html/storage/logs
      - passport-keys:/var/www/html/storage/passport
    secrets:
      - wallet_signer_hmac
    networks:
      - portfolio-net

  wallet-signer:
    image: ghcr.io/mohiebi/financemanager-wallet-signer:latest
    container_name: cashpilot-wallet-signer
    restart: unless-stopped
    env_file: .env.signer
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    ulimits:
      core: 0
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001
    volumes:
      - signer-keystore:/data
      - signer-operations:/operations
    secrets:
      - wallet_signer_hmac
    expose:
      - "8080"
    networks:
      - portfolio-net

volumes:
  storage-data:
  storage-logs:
  passport-keys:
  signer-keystore:
  signer-operations:

secrets:
  wallet_signer_hmac:
    file: ./secrets/wallet_signer_hmac

networks:
  portfolio-net:
    external: true
