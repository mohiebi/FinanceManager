[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:inertia-ssr]
command=php /var/www/html/artisan inertia:start-ssr
directory=/var/www/html
autostart=true
autorestart=true
priority=25
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/bin/sh -c "while true; do php /var/www/html/artisan schedule:run --no-interaction; sleep 60; done"
directory=/var/www/html
autostart=true
autorestart=true
priority=30
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-emails]
command=php /var/www/html/artisan queue:work --queue=emails --sleep=1 --tries=3 --max-time=3600
directory=/var/www/html
autostart=true
autorestart=true
priority=40
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-telegram]
command=php /var/www/html/artisan queue:work --queue=telegram --sleep=2 --tries=3 --max-time=3600
directory=/var/www/html
autostart=true
autorestart=true
priority=40
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-prices]
command=php /var/www/html/artisan queue:work --queue=prices --sleep=3 --tries=1 --max-time=3600
directory=/var/www/html
autostart=true
autorestart=true
priority=40
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-notifications]
command=php /var/www/html/artisan queue:work --queue=notifications --sleep=2 --tries=1 --max-time=3600
directory=/var/www/html
autostart=true
autorestart=true
priority=40
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-billing]
command=php /var/www/html/artisan queue:work --queue=billing --sleep=3 --tries=1 --timeout=330 --max-time=3600
directory=/var/www/html
autostart=true
autorestart=true
priority=40
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Anything dispatched without an explicit onQueue() lands here — the advisor's
; recommendation job among them, which is why the timeout is minutes rather than
; the default 60 seconds. Jobs that declare their own $timeout still win; this is
; the ceiling for the ones that do not.
[program:queue-default]
command=php /var/www/html/artisan queue:work --queue=default --sleep=2 --tries=1 --timeout=330 --max-time=3600
directory=/var/www/html
autostart=true
autorestart=true
priority=40
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
